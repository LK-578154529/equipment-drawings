<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备图纸 - EQ01</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 15px;
        }
        .info-table {
            width: 100%;
            text-align: left;
            font-size: 14px;
        }
        .info-table td {
            padding: 4px 0;
        }
        .info-table td:first-child {
            opacity: 0.8;
            width: 80px;
        }
        .drawing-list {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .drawing-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            text-decoration: none;
            color: #333;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
            cursor: pointer;
        }
        .drawing-item:last-child {
            border-bottom: none;
        }
        .drawing-item:hover {
            background: #f8f9fa;
        }
        .drawing-item:active {
            background: #e3f2fd;
        }
        .icon {
            width: 44px;
            height: 44px;
            background: #e3f2fd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 22px;
        }
        .drawing-info {
            flex: 1;
        }
        .drawing-info h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #333;
        }
        .drawing-info span {
            font-size: 13px;
            color: #888;
        }
        .arrow {
            color: #ccc;
            font-size: 22px;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #999;
            line-height: 1.8;
        }
        
        /* PDF 预览弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }
        .modal.active {
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #333;
            color: white;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 500;
        }
        .modal-close {
            background: #ff5252;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .modal-body {
            flex: 1;
            overflow: hidden;
        }
        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .download-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header">
            <h1>📋 设备电气图纸</h1>
            <table class="info-table">
                <tr>
                    <td>设备编号</td>
                    <td><strong>EQ01</strong></td>
                </tr>
                <tr>
                    <td>项目名称</td>
                    <td>XX自动化生产线</td>
                </tr>
                <tr>
                    <td>出厂日期</td>
                    <td>2025-01-04</td>
                </tr>
            </table>
        </div>

        <div class="drawing-list">
            
            <div class="drawing-item" onclick="openPDF('电气原理图.pdf', '电气原理图')">
                <div class="icon">📄</div>
                <div class="drawing-info">
                    <h3>电气原理图</h3>
                    <span>主回路及控制回路</span>
                </div>
                <div class="arrow">›</div>
            </div>

            <div class="drawing-item" onclick="openPDF('接线图.pdf', '接线图')">
                <div class="icon">🔌</div>
                <div class="drawing-info">
                    <h3>接线图</h3>
                    <span>端子排接线详图</span>
                </div>
                <div class="arrow">›</div>
            </div>

            <div class="drawing-item" onclick="openPDF('IO分配表.pdf', 'IO分配表')">
                <div class="icon">📊</div>
                <div class="drawing-info">
                    <h3>I/O 分配表</h3>
                    <span>PLC输入输出点位</span>
                </div>
                <div class="arrow">›</div>
            </div>

            <div class="drawing-item" onclick="openPDF('元器件清单.pdf', '元器件清单')">
                <div class="icon">📦</div>
                <div class="drawing-info">
                    <h3>元器件清单</h3>
                    <span>BOM物料清单</span>
                </div>
                <div class="arrow">›</div>
            </div>

        </div>

        <div class="footer">
            <p>技术支持：138-xxxx-xxxx</p>
            <p>© 你的公司名称</p>
        </div>

    </div>

    <!-- PDF 预览弹窗 -->
    <div class="modal" id="pdfModal">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">图纸预览</span>
            <div>
                <a class="download-btn" id="downloadBtn" href="" download>下载</a>
                <button class="modal-close" onclick="closeModal()">关闭</button>
            </div>
        </div>
        <div class="modal-body">
            <iframe id="pdfViewer" src=""></iframe>
        </div>
    </div>

    <script>
        function openPDF(filename, title) {
            const modal = document.getElementById('pdfModal');
            const viewer = document.getElementById('pdfViewer');
            const modalTitle = document.getElementById('modalTitle');
            const downloadBtn = document.getElementById('downloadBtn');
            
            modalTitle.textContent = title;
            viewer.src = './' + filename;
            downloadBtn.href = './' + filename;
            modal.classList.add('active');
            
            // 禁止背景滚动
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            const modal = document.getElementById('pdfModal');
            const viewer = document.getElementById('pdfViewer');
            
            modal.classList.remove('active');
            viewer.src = '';
            
            // 恢复背景滚动
            document.body.style.overflow = 'auto';
        }
        
        // 点击背景关闭
        document.getElementById('pdfModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
